<div class="login-container">
  <h2>Connexion</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div>
      <label for="username">Nom d'utilisateur</label>
      <input id="username" type="text" formControlName="username" />
      <small *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
        Le nom d'utilisateur est obligatoire
      </small>
    </div>

    <div>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" formControlName="password" />
      <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Le mot de passe est obligatoire
      </small>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
  </form>
  <li class="nav-item">
    <a class="nav-link" routerLink="/inscription">inscription</a>
  </li>
</div>
