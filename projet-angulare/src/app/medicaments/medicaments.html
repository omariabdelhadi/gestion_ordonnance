<div class="p-3">
  <div class="card">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>ID</th><th>Name</th><th>price unit</th><th>laboratory</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let m of medicamentsA">
          <td>{{m.id}}</td>

          <td>{{m.laboratory}}</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
