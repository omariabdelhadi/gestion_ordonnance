<div class="p-3">
  <div class="card">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Age</th><th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let p of patientsA">
          <td>{{p.id}}</td>
          <td>{{p.nom}}</td>
          <td>{{p.age}}</td>
          <td><button (click)="CreeOrdonnnace(p.id)">crée ordonnance</button></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
