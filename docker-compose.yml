services:
  discovery-service:
    image: abd1230/discovery-server:latest
    container_name: discovery-service
    ports:
      - '8761:8761'
    expose:
      - '8761'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8761/actuator/health"]
      interval: 10s

  gateway-server:
    image: abd1230/gateway-server:latest
    container_name: gateway-server
    ports:
      - '8886:8886'
    expose:
      - '8886'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8886/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
    depends_on:
      discovery-service:
        condition: service_healthy

  config-service:
    image: abd1230/config-service:latest
    container_name: config-service
    ports:
      - '9090:9999'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9999/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  patient-service:
    image: abd1230/patient-service:latest
    container_name: patient-service
    ports:
      - '8090:8081'
    expose:
      - '8081'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8081/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
    depends_on:
      gateway-server:
        condition: service_healthy
      config-service:
        condition: service_healthy

  medicament-service:
    image: abd1230/medicament-service:latest
    deploy:
      replicas: 2
    ports:
      - '8077-8091:8082'
    expose:
      - '8082'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8082/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      gateway-server:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka:
        condition: service_started

  ordonnance-service:
    image: abd1230/ordonnance-service:latest
    container_name: ordonnance-service
    ports:
      - '8092:8087'
    expose:
      - '8087'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8087/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      patient-service:
        condition: service_healthy
      medicament-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka:
        condition: service_started

  analytics-service:
    image: abd1230/analytics-service:latest
    container_name: analytics-service
    ports:
      - '8088:8088'
    expose:
      - '8088'
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8088/actuator/health"]
      interval: 10s
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      config-service:
        condition: service_healthy
      medicament-service:
        condition: service_healthy
      kafka:
        condition: service_started

  ordonnance-bot:
    image: abd1230/ordonnance-bot:latest
    container_name: ordonnance-bot
    ports:
      - '8899:8889'
    expose:
      - '8889'
    environment:
      - EUREKA_URL=http://discovery-service:8761/eureka/
      - CONFIG_EV=http://config-service:9999
      - ORDONNANCE_URL=http://ordonnance-service:8087/mcp
      - PATIENT_URL=http://patient-service:8081/mcp
      - MEDICAMENT_URL=http://medicament-service:8082/mcp
    depends_on:
      gateway-server:
        condition: service_healthy
      config-service:
        condition: service_healthy
      ordonnance-service:
        condition: service_healthy

  frontend-angulare-service:
    image: abd1230/projet-angulare:latest
    container_name: frontend-angulare-service
    ports:
      - '4200:80'
    expose:
      - '80'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - patient-service
      - analytics-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus